<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Weather Mood social card</title>
<!--
  Source for assets/social-preview.png (1280 x 640). Render it with
  `npm run social-card`. Everything here is local: the fonts sit in ./fonts
  and the particle field is drawn from a fixed seed, so every render matches.
  Colours come from the landing scene in lib/canvas/landingProfile.ts and the
  overlay styles in components/.
-->
<style>
  @font-face {
    font-family: "Cormorant Garamond";
    font-weight: 400;
    font-style: normal;
    src: url("fonts/cormorant-garamond-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Cormorant Garamond";
    font-weight: 400;
    font-style: italic;
    src: url("fonts/cormorant-garamond-latin-400-italic.woff2") format("woff2");
  }

  :root {
    /* lib/canvas/landingProfile.ts */
    --indigo: #0c0a26;   /* background top, [12, 10, 38] */
    --plum: #1c1234;     /* background bottom, [28, 18, 52] */
    --violet: #7856b4;   /* particle, glow and focus colour, [120, 90, 180] */
    --blue: #508cc8;     /* [80, 140, 200] */
    --rose: #b478a0;     /* [180, 120, 160] */
    --teal: #64b4b4;     /* [100, 180, 180] */
    --ink: rgba(255, 255, 255, 0.88);
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--indigo);
  }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: var(--indigo);
  }

  canvas {
    position: absolute;
    inset: 0;
  }

  .copy {
    position: absolute;
    left: 88px;
    top: 150px;
    right: 88px;
  }

  h1 {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 400;
    font-size: 140px;
    line-height: 0.95;
    letter-spacing: 0.06em;
    color: var(--ink);
    text-shadow: 0 0 48px rgba(120, 90, 180, 0.45), 0 2px 12px rgba(0, 0, 0, 0.5);
  }

  .caption {
    margin: 22px 0 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-size: 40px;
    white-space: nowrap;
    line-height: 1.25;
    color: rgba(255, 255, 255, 0.74);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
  }

  .tags {
    position: absolute;
    left: 88px;
    bottom: 72px;
    display: flex;
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  /* The same glass as the poem panel in components/PoemOverlay.tsx */
  .tags li {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 20px 12px 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(12, 10, 38, 0.62) 0%, rgba(28, 18, 52, 0.52) 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 21px;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: rgba(255, 255, 255, 0.84);
    white-space: nowrap;
  }

  .tags li::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--dot);
    box-shadow: 0 0 10px var(--dot);
  }

  .url {
    position: absolute;
    right: 88px;
    top: 72px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: rgba(255, 255, 255, 0.45);
  }
</style>
</head>
<body>
<div class="card" id="card">
  <canvas id="sky" width="1280" height="640"></canvas>
  <div class="url">weather-mood-chi.vercel.app</div>
  <div class="copy">
    <h1>Weather Mood</h1>
    <p class="caption">Pick a city and Weather Mood paints the weather there right now.</p>
  </div>
  <ul class="tags">
    <li style="--dot: var(--blue)">Live weather</li>
    <li style="--dot: var(--rose)">A poem for the place</li>
    <li style="--dot: var(--teal)">A voice and a score</li>
    <li style="--dot: var(--violet)">Claude critiques the canvas</li>
  </ul>
</div>

<script>
  // A still frame in the app's own idiom: the landing twilight, then the
  // weather moving across it from left to right, rain into snow into the
  // rising glow motes of the landing scene. The left side stays calm so the
  // words read, the way the critic asks for calm behind the poem.
  const W = 1280;
  const H = 640;
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  // Seeded PRNG so every render is identical.
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(20261026);

  // Small value noise for the cloud texture.
  const GRID = 64;
  const lattice = Array.from({ length: GRID * GRID }, () => rand());
  function smooth(t) { return t * t * (3 - 2 * t); }
  function noise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = smooth(x - xi), yf = smooth(y - yi);
    const at = (i, j) => lattice[((j % GRID + GRID) % GRID) * GRID + ((i % GRID + GRID) % GRID)];
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf;
  }
  function fbm(x, y) {
    let v = 0, amp = 0.5, f = 1;
    for (let o = 0; o < 4; o++) { v += amp * noise(x * f, y * f); amp *= 0.5; f *= 2; }
    return v;
  }

  const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
  const VIOLET = [120, 90, 180];
  const BLUE = [80, 140, 200];
  const ROSE = [180, 120, 160];
  const TEAL = [100, 180, 180];
  const RAIN = [[107, 143, 194], [138, 174, 212], [80, 140, 200]];
  const SNOW = [[232, 239, 245], [200, 214, 229], [255, 255, 255]];
  const GLOW = [VIOLET, BLUE, ROSE, TEAL];
  const pick = (list) => list[Math.floor(rand() * list.length)];

  function draw() {
    // Areas behind the words, measured after the fonts load, where the
    // weather thins out so the copy reads.
    const calmRects = [...document.querySelectorAll('h1, .caption, .url')].map((el) => {
      const r = el.getBoundingClientRect();
      return { x0: r.left - 24, y0: r.top - 10, x1: r.right + 24, y1: r.bottom + 10 };
    });
    function calm(x, y) {
      return calmRects.some((r) => x > r.x0 && x < r.x1 && y > r.y0 && y < r.y1) ? 0.18 : 1;
    }

    // 1. Background: the landing radial from indigo to plum.
    {
      const g = ctx.createRadialGradient(W * 0.62, H * 0.45, 0, W * 0.62, H * 0.45, W * 0.75);
      g.addColorStop(0, '#1c1234');
      g.addColorStop(1, '#0c0a26');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // 2. Cloud noise, faint, as in the landing profile.
    {
      const img = ctx.getImageData(0, 0, W, H);
      const d = img.data;
      for (let y = 0; y < H; y += 1) {
        for (let x = 0; x < W; x += 1) {
          const n = fbm(x * 0.006, y * 0.006);
          const k = (n - 0.35) * 26;
          const i = (y * W + x) * 4;
          d[i] = Math.max(0, Math.min(255, d[i] + k * 0.8));
          d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + k * 0.6));
          d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + k * 1.1));
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    // 3. Glow: the profile's violet glow, pooled to the right of the words.
    function pool(x, y, r, c, a) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(c, a));
      g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.globalCompositeOperation = 'lighter';
    pool(W * 0.86, H * 0.36, 420, [100, 60, 160], 0.38);
    pool(W * 0.6, H * 0.95, 360, [80, 140, 200], 0.12);
    pool(W * 1.02, H * 0.9, 300, [180, 120, 160], 0.14);
    ctx.globalCompositeOperation = 'source-over';

    // How much weather is allowed at a point: quiet behind the words on the
    // left, building towards the right edge.
    function density(x) {
      const t = x / W;
      return Math.max(0, Math.min(1, (t - 0.28) / 0.42));
    }

    // Which weather a point belongs to, blended with noise so the bands melt
    // into each other rather than meeting at a line.
    function weatherAt(x, y) {
      const t = x / W + (fbm(x * 0.004, y * 0.004 + 9) - 0.5) * 0.22;
      if (t < 0.58) return 'rain';
      if (t < 0.78) return 'snow';
      return 'glow';
    }

    ctx.globalCompositeOperation = 'lighter';

    // Rain: slanted streaks, wind from the left.
    for (let i = 0; i < 1400; i++) {
      const x = rand() * W, y = rand() * H;
      if (weatherAt(x, y) !== 'rain' || rand() > (density(x) * 0.9 + 0.04) * calm(x, y)) continue;
      const len = 14 + rand() * 30;
      const a = 0.14 + rand() * 0.4;
      ctx.strokeStyle = rgba(pick(RAIN), a);
      ctx.lineWidth = 0.8 + rand() * 1.1;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + len * 0.28, y + len);
      ctx.stroke();
    }

    // Snow: soft discs drifting down.
    for (let i = 0; i < 900; i++) {
      const x = rand() * W, y = rand() * H;
      if (weatherAt(x, y) !== 'snow' || rand() > density(x) * calm(x, y)) continue;
      const r = 1 + rand() * 3.2;
      const c = pick(SNOW);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.4);
      g.addColorStop(0, rgba(c, 0.55 + rand() * 0.35));
      g.addColorStop(0.45, rgba(c, 0.25));
      g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r * 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Glow motes: the landing particles, rising, sizes 2 to 8, with short
    // trails beneath them to show the upward drift.
    for (let i = 0; i < 520; i++) {
      const x = rand() * W, y = rand() * H;
      const w = weatherAt(x, y);
      const allowed = (w === 'glow' ? density(x) : 0.05) * calm(x, y);
      if (rand() > allowed) continue;
      const r = 2 + rand() * 6;
      const c = pick(GLOW);
      const a = 0.15 + rand() * 0.35;
      const trail = ctx.createLinearGradient(x, y, x, y + r * 7);
      trail.addColorStop(0, rgba(c, a * 0.5));
      trail.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = trail;
      ctx.fillRect(x - r * 0.35, y, r * 0.7, r * 7);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
      g.addColorStop(0, rgba(c, Math.min(1, a * 2)));
      g.addColorStop(0.3, rgba(c, a));
      g.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r * 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';

    // 4. Vignette, so the edges settle into the page's black.
    {
      const g = ctx.createRadialGradient(W * 0.55, H * 0.5, H * 0.45, W * 0.55, H * 0.5, W * 0.72);
      g.addColorStop(0, 'rgba(0, 0, 0, 0)');
      g.addColorStop(1, 'rgba(0, 0, 0, 0.45)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Load every declared face, used or not, so the renderer can check them.
  Promise.all([...document.fonts].map((f) => f.load()))
    .then(() => document.fonts.ready)
    .then(() => {
      draw();
      document.body.dataset.ready = 'true';
    });
</script>
</body>
</html>
